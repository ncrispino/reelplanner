<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The staging runs behind 8 MB parts</title>
<!-- Test fixture (packages/player/test/details.spec.mjs): an "evidence" detail with the bridge from
     the deep-dives contract, section 3. Self-contained: nothing loads from the network. -->
<style>
  :root { --paper:#FAF9F5; --tile:#EFE9DE; --ink:#141413; --ink-rgb:20,20,19; --accent:#CC785C; }
  :root[data-theme="dark"] { --paper:#141310; --tile:#232120; --ink:#F2EFE8; --ink-rgb:242,239,232; }
  body { margin:0; padding:20px; background:var(--paper); color:var(--ink); font:14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  h1 { font:400 20px/1.3 Georgia, serif; margin:0 0 4px; }
  p { margin:0 0 16px; color:rgba(var(--ink-rgb),.72); }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid rgba(var(--ink-rgb),.12); }
  th { font:500 11px/1 ui-monospace, monospace; letter-spacing:.06em; text-transform:uppercase; color:rgba(var(--ink-rgb),.55); }
  tr.pick td:first-child { box-shadow:inset 2px 0 0 var(--accent); }
  [data-anchor] { cursor:pointer; }
  [data-anchor]:hover { outline:1px solid rgba(var(--ink-rgb),.2); outline-offset:-1px; }
</style>
</head>
<body>
<h1>The staging runs behind 8 MB parts</h1>
<p>Each part size through the same 40 dropped connections on a 2 GB upload. Click a row to comment on it.</p>
<table>
  <thead><tr><th>Part size</th><th>Parts resent</th><th>Time to finish</th><th>Retries</th></tr></thead>
  <tbody>
    <tr data-anchor="row: 5 MB"><td>5 MB</td><td>41</td><td>6 m 12 s</td><td>44</td></tr>
    <tr data-anchor="row: 8 MB" class="pick"><td>8 MB</td><td>40</td><td>5 m 31 s</td><td>41</td></tr>
    <tr data-anchor="row: 16 MB"><td>16 MB</td><td>40</td><td>5 m 58 s</td><td>40</td></tr>
    <tr data-anchor="row: 32 MB"><td>32 MB</td><td>40</td><td>7 m 04 s</td><td>40</td></tr>
  </tbody>
</table>
<script>
/* reelplanning detail bridge (contract §3) */
(() => {
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  if ((q.get("theme") || h.get("theme")) === "dark") document.documentElement.dataset.theme = "dark";
  const post = (m) => parent.postMessage({ type: "rp-detail", ...m }, "*");
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-anchor]"); if (!el) return;
    const sel = String(getSelection() || "").trim();
    post({ event: "anchor", anchor: el.dataset.anchor, text: (sel || el.innerText.replace(/\s+/g, " ").trim()).slice(0, 200) });
  });
  addEventListener("load", () => post({ event: "ready", title: document.title }));
})();
</script>
</body>
</html>
