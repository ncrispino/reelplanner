    /* full-bleed cream ground — its own clip layer, never on #root */
    #f04-step-1-ground { position: absolute; inset: 0; width: 1920px; height: 1080px; background: #FAF9F5; }
    #f04-step-1-stage  { position: absolute; inset: 0; width: 1920px; height: 1080px; }

    /* ===== SHARED STAGE (frames 03–12) — geometry law: rail x80 w540, six slots y=170+112*i h96; nodes at fixed boxes ===== */
    .f04-step-1-rail { position:absolute; left:80px; top:170px; width:540px; height:660px; }
    .f04-step-1-slot { position:absolute; left:0; width:540px; height:96px; border-radius:12px;
                border:1px dashed rgba(20,20,19,0.18); }
    .f04-step-1-slot[data-filled] { border:1px solid rgba(20,20,19,0.12); background:#EFE9DE;
                box-shadow:0 1px 3px rgba(20,20,19,0.08),0 4px 16px rgba(20,20,19,0.04); }
    .f04-step-1-slot .n { position:absolute; left:22px; top:30px; font:500 26px/1 "JetBrains Mono"; letter-spacing:0.02em; color:#141413; }
    .f04-step-1-slot .t { position:absolute; left:78px; top:29px; font:500 30px/1.2 "Inter"; letter-spacing:-0.005em; color:#141413; }
    .f04-step-1-slot.dim { opacity:0.72; }
    .f04-step-1-node { position:absolute; border-radius:12px; background:#EFE9DE; border:1px solid rgba(20,20,19,0.12);
                box-shadow:0 1px 3px rgba(20,20,19,0.08),0 4px 16px rgba(20,20,19,0.04); }
    .f04-step-1-node .l { position:absolute; left:20px; top:20px; font:500 28px/1.2 "Inter"; color:#141413; }
    .f04-step-1-node .s { position:absolute; left:20px; top:58px; font:500 18px/1 "JetBrains Mono"; letter-spacing:0.12em; text-transform:uppercase; color:rgba(20,20,19,0.62); }
    .f04-step-1-node.navy { background:#181715; border-color:rgba(250,249,245,0.14); }
    .f04-step-1-node.navy .l { color:#FAF9F5; } .f04-step-1-node.navy .s { color:rgba(250,249,245,0.7); }
    .f04-step-1-node.dim { opacity:0.72; }
    .f04-step-1-node.active { border:2px solid #CC785C; }
    .f04-step-1-edges { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible; pointer-events:none; }
    .f04-step-1-edges path { fill:none; stroke:#141413; stroke-width:2; stroke-linecap:round; }
    .f04-step-1-edges path.dim { opacity:0.35; }
    .f04-step-1-edges path.active { stroke:#CC785C; stroke-width:3; }
    /* ===== end shared stage ===== */

    /* Per-frame state layers (geometry-neutral overlays; GSAP drives them) */
    /* Slot 1 fill: the data-filled look as an overlay that covers the dashed outline exactly */
    .f04-step-1-slotfill { position:absolute; inset:-1px; border-radius:12px; border:1px solid rgba(20,20,19,0.12); background:#EFE9DE;
                box-shadow:0 1px 3px rgba(20,20,19,0.08),0 4px 16px rgba(20,20,19,0.04); opacity:0; }
    .f04-step-1-slot .n, .f04-step-1-slot .t { transform-origin: 50% 50%; will-change: transform; }
    .f04-step-1-slot.empty .n, .f04-step-1-slot.empty .t { opacity:0; }
    /* The ONE coral signal, on the manifest node's border: an overlay ring at the node's own border box */
    .f04-step-1-ring { position:absolute; inset:-1px; border-radius:12px; border:2px solid #CC785C; opacity:0; pointer-events:none; }
    /* Manifest row — mono, cream on navy, inside the node from y≈95 down */
    .f04-step-1-row { position:absolute; left:20px; top:94px; display:flex; align-items:baseline;
                font:400 18px/1 "JetBrains Mono"; color:#FAF9F5; white-space:nowrap; }
    .f04-step-1-row .w { display:inline-flex; align-items:baseline; min-width:218px; white-space:nowrap; }
    .f04-step-1-row .txt { white-space:pre; }
    .f04-step-1-row .cur { display:inline-block; width:6px; height:16px; margin-left:2px; background:#FAF9F5; opacity:0; transform:translateY(2px); }
    /* ✓ record tag — quiet mono chrome, no coral */
    .f04-step-1-tag { position:absolute; left:20px; top:119px; height:22px; padding:0 8px; border-radius:6px;
                border:1px solid rgba(250,249,245,0.14); font:400 13px/22px "JetBrains Mono"; letter-spacing:0.12em; text-transform:uppercase;
                color:rgba(250,249,245,0.82); opacity:0; }
    .f04-step-1-tag .ok { color:#5DB872; margin-right:6px; }
  </style>

  <div id="root" data-composition-id="04-step-1" data-width="1920" data-height="1080" data-duration="9.972">
    <!-- ground -->
    <div id="f04-step-1-ground" class="clip" data-start="0" data-duration="9.972" data-track-index="0"></div>

    <!-- stage -->
    <div id="f04-step-1-stage" class="clip" data-start="0" data-duration="9.972" data-track-index="1">

      <!-- RAIL: six slots; all empty at t=0 for this frame, slot 1 fills on cue -->
      <div class="f04-step-1-rail" id="f04-step-1-rail">
        <div class="f04-step-1-slot empty" id="f04-step-1-slot-1" data-plan-step="1" style="top:0px"><div class="f04-step-1-slotfill" id="f04-step-1-slotfill-1"></div><span class="n">1</span><span class="t">Write-ahead manifest</span></div>
        <div class="f04-step-1-slot empty" id="f04-step-1-slot-2" data-plan-step="2" style="top:112px"><span class="n">2</span><span class="t">Chunked parts</span></div>
        <div class="f04-step-1-slot empty" id="f04-step-1-slot-3" data-plan-step="3" style="top:224px"><span class="n">3</span><span class="t">Resume endpoint</span></div>
        <div class="f04-step-1-slot empty" id="f04-step-1-slot-4" data-plan-step="4" style="top:336px"><span class="n">4</span><span class="t">Billing on complete</span></div>
        <div class="f04-step-1-slot empty" id="f04-step-1-slot-5" data-plan-step="5" style="top:448px"><span class="n">5</span><span class="t">Sweeper</span></div>
        <div class="f04-step-1-slot empty" id="f04-step-1-slot-6" data-plan-step="6" style="top:560px"><span class="n">6</span><span class="t">SDK resume</span></div>
      </div>

      <!-- DIAGRAM: six nodes, fixed boxes; all dim at t=0 -->
      <div class="f04-step-1-node dim" id="f04-step-1-node-sdk"      data-plan-component="sdk"      style="left:700px;  top:380px; width:240px; height:100px"><span class="l">Client SDK</span><span class="s">packages/sdk</span></div>
      <div class="f04-step-1-node dim" id="f04-step-1-node-api"      data-plan-component="api"      style="left:1000px; top:380px; width:240px; height:100px"><span class="l">Upload API</span><span class="s">src/upload</span></div>
      <div class="f04-step-1-node navy dim" id="f04-step-1-node-manifest" data-plan-component="manifest" style="left:1300px; top:200px; width:260px; height:150px">
        <span class="l">Manifest store</span><span class="s">upload_manifests</span>
        <div class="f04-step-1-row" id="f04-step-1-row"><span class="w"><span class="txt" id="f04-step-1-rowtxt"></span><span class="cur" id="f04-step-1-cur"></span></span></div>
        <div class="f04-step-1-tag" id="f04-step-1-tag"><span class="ok">✓</span>record</div>
        <div class="f04-step-1-ring" id="f04-step-1-ring"></div>
      </div>
      <div class="f04-step-1-node dim" id="f04-step-1-node-blob"     data-plan-component="blob"     style="left:1300px; top:540px; width:260px; height:100px"><span class="l">Blob store</span><span class="s">src/blob</span></div>
      <div class="f04-step-1-node dim" id="f04-step-1-node-billing"  data-plan-component="billing"  style="left:1620px; top:200px; width:220px; height:100px"><span class="l">Billing hook</span><span class="s">src/billing</span></div>
      <div class="f04-step-1-node dim" id="f04-step-1-node-sweeper"  data-plan-component="sweeper"  style="left:1620px; top:540px; width:220px; height:100px"><span class="l">Sweeper</span><span class="s">src/jobs</span></div>

      <!-- EDGES: only this frame's edge (api → manifest), drawn on cue -->
      <svg class="f04-step-1-edges" id="f04-step-1-edges" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <path id="f04-step-1-e-api-manifest" d="M1240 405 L1270 405 L1270 275 L1300 275" />
      </svg>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "04-step-1";
      var q = function (s) { return document.querySelector(s); };

      var slot1   = q("#f04-step-1-slot-1");
      var fill1   = q("#f04-step-1-slotfill-1");
      var num1    = q("#f04-step-1-slot-1 .n");
      var title1  = q("#f04-step-1-slot-1 .t");
      var nodeApi = q("#f04-step-1-node-api");
      var nodeMan = q("#f04-step-1-node-manifest");
      var ring    = q("#f04-step-1-ring");
      var edge    = q("#f04-step-1-e-api-manifest");
      var rowTxt  = q("#f04-step-1-rowtxt");
      var cursor  = q("#f04-step-1-cur");
      var tag     = q("#f04-step-1-tag");

      // Slot 1's number + title are hidden by the .empty class at t=0; the fromTo below owns them from here on.
      slot1.classList.remove("empty");

      // svg-path-draw setup: measured length, never guessed
      var len = edge.getTotalLength() * 1.02;
      edge.style.strokeDasharray = String(len);
      edge.style.strokeDashoffset = String(len);

      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.0–1.4s): "Step one — the manifest." ---------- */
      // Rail slot 1 fills (data-filled look) and its number + title pop in — spring-pop-entrance, smooth power3 settle
      tl.fromTo(fill1, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.10);
      tl.fromTo(num1,   { scale: 0, opacity: 0, y: 8 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.12);
      tl.fromTo(title1, { scale: 0, opacity: 0, y: 8 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.18);

      // "the manifest" — the manifest node lifts from dim and the one coral signal lands on its border
      tl.fromTo(nodeMan, { opacity: 0.72 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.85);
      tl.fromTo(ring, { opacity: 0, borderWidth: 2, borderColor: "#CC785C" },
                      { opacity: 1, borderWidth: 2, borderColor: "#CC785C", duration: 0.45, ease: "power2.out" }, 0.9);

      /* ---------- Scene 2 (1.4–5.6s): "Before the API accepts a single byte, it writes a manifest row." ---------- */
      // "Before the API accepts" — the API node lifts to full opacity
      tl.fromTo(nodeApi, { opacity: 0.72 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.7);

      // "writes a manifest row" — coral hands off: the ring settles back into the node's own hairline …
      tl.fromTo(ring, { borderWidth: 2, borderColor: "#CC785C" },
                      { borderWidth: 1, borderColor: "rgba(250,249,245,0.14)", duration: 0.35, ease: "power2.out", immediateRender: false }, 3.55);
      // … the api → manifest edge draws on in ink (svg-path-draw) …
      tl.fromTo(edge, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 3.8);
      // … and becomes the one coral element once the ring has let go
      tl.fromTo(edge, { stroke: "#141413", strokeWidth: 2 },
                      { stroke: "#CC785C", strokeWidth: 3, duration: 0.3, ease: "power1.out", immediateRender: false }, 4.05);

      // The manifest row types in — discrete-text-sequence (keystroke clusters, word-break pauses, bulk paste)
      var T0 = 4.3;
      var SEQ = [
        { t: 0.00, text: "" },
        { t: 0.02, text: "7" },
        { t: 0.12, text: "7f" },
        { t: 0.20, text: "7f3" },
        { t: 0.32, text: "7f3a" },
        { t: 0.70, text: "7f3a ·" },
        { t: 0.80, text: "7f3a · " },
        { t: 0.92, text: "7f3a · 2" },
        { t: 1.06, text: "7f3a · 2 " },
        { t: 1.18, text: "7f3a · 2 GB" },
        { t: 1.60, text: "7f3a · 2 GB ·" },
        { t: 1.72, text: "7f3a · 2 GB · " },
        { t: 1.86, text: "7f3a · 2 GB · 000000" }
      ];
      function textAt(t) {
        for (var i = SEQ.length - 1; i >= 0; i--) { if (t >= SEQ[i].t) return SEQ[i].text; }
        return "";
      }
      var TYPE_DUR = 2.0;
      var driver = { t: 0 };
      tl.fromTo(driver, { t: 0 }, {
        t: TYPE_DUR, duration: TYPE_DUR, ease: "none",
        onUpdate: function () { rowTxt.textContent = textAt(driver.t); }
      }, T0);

      // Cursor blink — deterministic sin square wave on the same timeline; ends on a zero crossing (hidden)
      var BLINK_DUR = 3.3;               // 4.3 → 7.6, hands off to the ✓ record tag
      var BLINK_CYCLES = 5;              // one cycle per 0.66s
      var blink = { p: 0 };
      tl.fromTo(blink, { p: 0 }, {
        p: Math.PI * 2 * BLINK_CYCLES, duration: BLINK_DUR, ease: "none",
        onUpdate: function () { cursor.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0"; }
      }, T0);

      /* ---------- Scene 3 (5.6–9.0s): "A crash anywhere later leaves a record." ---------- */
      // "leaves a record" — the ✓ record tag fades in beside the row; then hold with the edge lit
      tl.fromTo(tag, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 7.6);

      // hold to the frame's full duration (9.472s) — no exit; the root seam owns the hand-off
      tl.to({}, { duration: 0.01 }, 9.46);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
