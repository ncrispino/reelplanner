    /* ===== SHARED STAGE (frames 03–12) — geometry law: rail x80 w540, six slots y=170+112*i h96; diagram nodes at fixed boxes ===== */
    .f03-pretrain-rail { position:absolute; left:80px; top:170px; width:540px; height:660px; }

                box-shadow:0 1px 3px rgba(20,20,19,0.08),0 4px 16px rgba(20,20,19,0.04); }
    .f03-pretrain-node .l { position:absolute; left:20px; top:20px; font:500 28px/1.2 "Inter"; color:#141413; white-space:nowrap; }

    .f03-pretrain-node.navy { background:#181715; border-color:rgba(250,249,245,0.14); }
    .f03-pretrain-node.navy .l { color:#FAF9F5; } .f03-pretrain-node.navy .s { color:rgba(250,249,245,0.7); }
    .f03-pretrain-node.dim { opacity:0.72; }
    .f03-pretrain-node.active { border:2px solid #CC785C; }   /* the ONE coral signal */
    .f03-pretrain-edges { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible; pointer-events:none; }

    .f03-pretrain-edges path.active { stroke:#CC785C; stroke-width:3; }

    /* this frame: every slot is EMPTY — dashed outline only, number + title hidden */
    .f03-pretrain-slot .n, .f03-pretrain-slot .t { opacity: 0; }
  </style>

  <div id="root" data-composition-id="03-pretrain" data-width="1920" data-height="1080" data-duration="8.799">
    <!-- full-bleed cream ground -->

    <div class="clip f03-pretrain-layer" id="f03-pretrain-stage" data-start="0" data-duration="8.799" data-track-index="1">

      <!-- RAIL: six empty slots -->
      <div class="f03-pretrain-rail" id="f03-pretrain-rail">
        <div class="f03-pretrain-slot" id="f03-pretrain-slot-1" data-plan-step="1" style="top:0px"><span class="n">1</span><span class="t">Write-ahead manifest</span></div>
        <div class="f03-pretrain-slot" id="f03-pretrain-slot-2" data-plan-step="2" style="top:112px"><span class="n">2</span><span class="t">Chunked parts</span></div>
        <div class="f03-pretrain-slot" id="f03-pretrain-slot-3" data-plan-step="3" style="top:224px"><span class="n">3</span><span class="t">Resume endpoint</span></div>
        <div class="f03-pretrain-slot" id="f03-pretrain-slot-4" data-plan-step="4" style="top:336px"><span class="n">4</span><span class="t">Billing on complete</span></div>
        <div class="f03-pretrain-slot" id="f03-pretrain-slot-5" data-plan-step="5" style="top:448px"><span class="n">5</span><span class="t">Sweeper</span></div>
        <div class="f03-pretrain-slot" id="f03-pretrain-slot-6" data-plan-step="6" style="top:560px"><span class="n">6</span><span class="t">SDK resume</span></div>
      </div>

      <!-- DIAGRAM: six nodes, fixed boxes. data-sx/-sy = short-path start offset (from just outside the final box, toward the diagram center) -->
      <div class="f03-pretrain-node" id="f03-pretrain-node-sdk"      data-plan-component="sdk"      data-sx="44"  data-sy="10"  style="left:700px;  top:380px; width:240px; height:100px"><span class="l">Client SDK</span><span class="s">packages/sdk</span></div>
      <div class="f03-pretrain-node" id="f03-pretrain-node-api"      data-plan-component="api"      data-sx="36"  data-sy="10"  style="left:1000px; top:380px; width:240px; height:100px"><span class="l">Upload API</span><span class="s">src/upload</span></div>
      <div class="f03-pretrain-node navy" id="f03-pretrain-node-manifest" data-plan-component="manifest" data-sx="0" data-sy="44" style="left:1300px; top:200px; width:260px; height:150px"><span class="l">Manifest store</span><span class="s">upload_manifests</span></div>
      <div class="f03-pretrain-node" id="f03-pretrain-node-blob"     data-plan-component="blob"     data-sx="0"   data-sy="-44" style="left:1300px; top:540px; width:260px; height:100px"><span class="l">Blob store</span><span class="s">src/blob</span></div>
      <div class="f03-pretrain-node" id="f03-pretrain-node-billing"  data-plan-component="billing"  data-sx="-44" data-sy="20"  style="left:1620px; top:200px; width:220px; height:100px"><span class="l">Billing hook</span><span class="s">src/billing</span></div>
      <div class="f03-pretrain-node" id="f03-pretrain-node-sweeper"  data-plan-component="sweeper"  data-sx="-44" data-sy="-20" style="left:1620px; top:540px; width:220px; height:100px"><span class="l">Sweeper</span><span class="s">src/jobs</span></div>

    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="03-pretrain"]');
      var q = function (sel) { return root.querySelector(sel); };
      var qa = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

      var CORAL = "#CC785C";
      var INK_SOFT = "rgba(20,20,19,0.62)";

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["03-pretrain"] = tl;

      var kicker = q("#f03-pretrain-kicker");
      var spike  = q("#f03-pretrain-spike");
      var slots  = qa(".f03-pretrain-slot");

      /* ---- Scene 1 (0.0–1.0s): ground + kicker + the empty six-slot rail ---- */
      tl.fromTo(kicker, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.08);
      tl.fromTo(spike,  { scale: 0.92 }, { scale: 1, duration: 0.55, ease: "power3.out", transformOrigin: "50% 50%" }, 0.08);
      slots.forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.22 + i * 0.07);
      });

      /* ---- Scene 2 (1.0–6.0s): six nodes assemble one per spoken cue (center-outward-expansion, short path) ---- */
      var CUES = [
        { id: "sdk",      at: 0.95 },   // "the client SDK"
        { id: "api",      at: 1.90 },   // "the upload API"
        { id: "manifest", at: 2.90 },   // "a new manifest store"
        { id: "blob",     at: 3.90 },   // "the blob store"
        { id: "billing",  at: 4.85 },   // "the billing hook"
        { id: "sweeper",  at: 5.80 }    // "and a sweeper"
      ];
      var ACTIVE_HOLD = 0.72;   // the coral instant, cleared before the next name lands
      var nodes = [];

      /* the coral moves from the spike to the nodes while they are named */
      tl.to(spike, { color: INK_SOFT, duration: 0.3, ease: "power2.out" }, CUES[0].at);

      CUES.forEach(function (c) {
        var el = q("#f03-pretrain-node-" + c.id);
        nodes.push(el);
        var base = el.getAttribute("class");
        tl.fromTo(el,
          { x: Number(el.dataset.sx), y: Number(el.dataset.sy), scale: 0.94, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "power3.out", transformOrigin: "50% 50%" },
          c.at);
        tl.set(el, { attr: { class: base + " active" } }, c.at);
        tl.set(el, { attr: { class: base } }, c.at + ACTIVE_HOLD);
      });

      /* ---- Scene 3 (6.9s–end): held read — the full cast rests at 0.72, no edges yet ---- */
      var SETTLE = 6.9;
      nodes.forEach(function (el) {
        var base = el.getAttribute("class");
        tl.set(el, { attr: { class: base + " dim" } }, SETTLE);
      });
      tl.to(nodes, { opacity: 0.72, duration: 0.5, ease: "power2.out" }, SETTLE);
      tl.to(spike, { color: CORAL, duration: 0.4, ease: "power2.out" }, SETTLE + 0.1);

      /* pin the timeline to the frame's duration */
      tl.to({}, { duration: 0.001 }, 8.298);
    })();
  </script>
