  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["10-callback"] = tl;

      var pct = document.getElementById("f10-callback-pct");
      var fill = document.getElementById("f10-callback-fill");
      var track = document.getElementById("f10-callback-track");
      var tick = document.getElementById("f10-callback-tick");
      var tag = document.getElementById("f10-callback-tag");
      var figure = document.getElementById("f10-callback-figure");
      var spike = document.getElementById("f10-callback-spike");
      var unit = document.getElementById("f10-callback-unit");
      var resumePath = [
        document.getElementById("f10-callback-e-sdk-api"),
        document.getElementById("f10-callback-e-api-blob")
      ];
      var billingEdge = document.getElementById("f10-callback-e-api-billing");

      var counter = { v: 0 };
      function paint() { pct.textContent = Math.round(counter.v) + "%"; }

      /* rest states (seek-safe — everything else is authored via fromTo) */
      gsap.set(fill, { scaleX: 0, transformOrigin: "left center" });
      gsap.set(tick, { opacity: 0 });
      gsap.set(tag, { opacity: 0 });
      gsap.set([figure, spike, unit], { opacity: 0 });

      /* ---- Scene 1 (0.0–2.2s): the hook's bar returns, fills to 90% and dies on "ninety percent" ---- */
      tl.fromTo([track, pct], { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.0);
      tl.fromTo(fill, { scaleX: 0 }, { scaleX: 0.9, duration: 1.25, ease: "none" }, 0.4);            /* linear: it stops mid-stride — the crash */
      tl.fromTo(counter, { v: 0 }, { v: 90, duration: 1.25, ease: "none", onUpdate: paint }, 0.4);
      tl.fromTo(tick, { opacity: 0, scaleY: 0, transformOrigin: "center center" }, { opacity: 1, scaleY: 1, duration: 0.22, ease: "power3.out" }, 1.65);
      tl.fromTo(tag, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.85);

      /* ---- Scene 2 (2.2–4.8s): "resumes from ninety" — the same fill continues 90 → 100, no reset; sdk→api→blob lift in ink ---- */
      tl.to(resumePath, { opacity: 1, duration: 0.3, ease: "power3.out" }, 2.3);
      tl.fromTo(fill, { scaleX: 0.9 }, { scaleX: 1, duration: 1.0, ease: "power3.out" }, 2.35);
      tl.fromTo(counter, { v: 90 }, { v: 100, duration: 1.0, ease: "power3.out", onUpdate: paint }, 2.35);
      tl.to(resumePath, { opacity: 0.72, duration: 0.6, ease: "power3.out" }, 3.75);

      /* ---- Scene 3 (4.8s → hold): "fires once" — ×1 billed spring-pops right of the bar; the coral ✱ is the one coral ---- */
      tl.to(billingEdge, { opacity: 1, duration: 0.4, ease: "power3.out" }, 4.85);
      tl.fromTo(figure, { opacity: 0, scale: 0.72, transformOrigin: "left center" }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 4.85);
      tl.fromTo(spike, { opacity: 0, scale: 0.2, transformOrigin: "center center" }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 4.95);
      tl.fromTo(unit, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.15);

      /* hold to the frame's full duration (6.379s) */
      tl.to({}, { duration: 0.001 }, 6.379);
    })();
  </script>
