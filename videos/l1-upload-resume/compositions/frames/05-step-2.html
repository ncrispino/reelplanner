    /* ===== SHARED STAGE (frames 03–12) — geometry law: rail x80 w540, six slots y=170+112*i h96; nodes at fixed boxes ===== */

    .f05-step-2-slot { position:absolute; left:0; width:540px; height:96px; border-radius:12px;

    .f05-step-2-slot .n { position:absolute; left:22px; top:30px; font:500 26px/1 "JetBrains Mono"; letter-spacing:0.02em; color:#141413; }
    .f05-step-2-slot .t { position:absolute; left:78px; top:29px; font:500 30px/1.2 "Inter"; letter-spacing:-0.005em; color:#141413; }
    .f05-step-2-slot.dim { opacity:0.72; }
    .f05-step-2-slot.empty .n, .f05-step-2-slot.empty .t { opacity:0; }
    .f05-step-2-node { position:absolute; border-radius:12px; background:#EFE9DE; border:1px solid rgba(20,20,19,0.12);
                box-shadow:0 1px 3px rgba(20,20,19,0.08),0 4px 16px rgba(20,20,19,0.04); }
    .f05-step-2-node .l { position:absolute; left:20px; top:20px; font:500 28px/1.2 "Inter"; color:#141413; }
    .f05-step-2-node .s { position:absolute; left:20px; top:58px; font:500 18px/1 "JetBrains Mono"; letter-spacing:0.12em; text-transform:uppercase; color:rgba(20,20,19,0.62); }
    .f05-step-2-node.navy { background:#181715; border-color:rgba(250,249,245,0.14); }
    .f05-step-2-node.navy .l { color:#FAF9F5; } .f05-step-2-node.navy .s { color:rgba(250,249,245,0.7); }
    .f05-step-2-node.dim { opacity:0.72; }
    .f05-step-2-node.active { border:2px solid #CC785C; }
    .f05-step-2-edges { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible; pointer-events:none; }
    .f05-step-2-edges path { fill:none; stroke:#141413; stroke-width:2; stroke-linecap:round; }
    .f05-step-2-edges path.dim { opacity:0.35; }
    .f05-step-2-edges path.active { stroke:#CC785C; stroke-width:3; }
    /* ===== end shared stage ===== */

    /* slot 2 fill overlay — lands on cue, spans ride above it */
    .f05-step-2-slotfill { position:absolute; inset:-1px; border-radius:12px; background:#EFE9DE;
                border:1px solid rgba(20,20,19,0.12);
                box-shadow:0 1px 3px rgba(20,20,19,0.08),0 4px 16px rgba(20,20,19,0.04); }
    /* the ONE coral signal on the Blob node before it hands off to the edge */
    .f05-step-2-ring { position:absolute; inset:-1px; border-radius:12px; border:2px solid #CC785C; pointer-events:none; }
    /* manifest row: mono, cream on navy, from y≈100 inside the node */
    .f05-step-2-row { position:absolute; left:20px; top:100px; font:400 18px/1 "JetBrains Mono"; letter-spacing:0; white-space:nowrap; color:#FAF9F5; }
    .f05-step-2-bits { display:inline-block; transform-origin:left center; }
    .f05-step-2-ones { color:#FAF9F5; }
    .f05-step-2-zeros { color:rgba(250,249,245,0.55); }
    /* six 32×32 hairline part boxes under Blob */
    .f05-step-2-parts { position:absolute; left:1300px; top:660px; display:flex; gap:12px; }
    .f05-step-2-box { position:relative; width:32px; height:32px; border:1px solid rgba(20,20,19,0.2); border-radius:6px; background:#FAF9F5; overflow:hidden; box-sizing:border-box; }
    .f05-step-2-fill { position:absolute; inset:0; width:100%; height:100%; background:#141413; transform:scaleX(0); transform-origin:left center; }
    /* re-send chip + status badge */
    .f05-step-2-tick { position:absolute; left:1315px; top:694px; width:2px; height:20px; background:rgba(20,20,19,0.4); transform-origin:top center; }
    .f05-step-2-chip { position:absolute; left:1300px; top:716px; display:inline-flex; align-items:center; gap:12px;
                padding:10px 14px; border-radius:6px; background:#EFE9DE; border:1px solid rgba(20,20,19,0.12);
                box-shadow:0 1px 3px rgba(20,20,19,0.08),0 4px 16px rgba(20,20,19,0.04);
                font:400 22px/1 "JetBrains Mono"; letter-spacing:0.02em; color:#141413; white-space:nowrap; }
    .f05-step-2-badge { display:inline-block; padding:5px 8px; border-radius:6px; background:#141413; color:#FAF9F5;
                font:400 18px/1 "JetBrains Mono"; letter-spacing:0.04em; transform-origin:center; }
  </style>

  <div id="root" data-composition-id="05-step-2" data-width="1920" data-height="1080" data-duration="10.996">
    <div id="f05-step-2-bg" class="clip" data-start="0" data-duration="10.996" data-track-index="0"></div>

    <div id="f05-step-2-stage" class="clip" data-start="0" data-duration="10.996" data-track-index="1">

      <!-- RAIL -->
      <div class="f05-step-2-rail" id="f05-step-2-rail">
        <div class="f05-step-2-slot dim" id="f05-step-2-slot-1" data-plan-step="1" data-filled style="top:0px"><span class="n">1</span><span class="t">Write-ahead manifest</span></div>
        <div class="f05-step-2-slot" id="f05-step-2-slot-2" data-plan-step="2" style="top:112px"><div class="f05-step-2-slotfill" id="f05-step-2-slotfill"></div><span class="n" id="f05-step-2-slot-2-n">2</span><span class="t" id="f05-step-2-slot-2-t">Chunked parts</span></div>
        <div class="f05-step-2-slot empty" id="f05-step-2-slot-3" data-plan-step="3" style="top:224px"><span class="n">3</span><span class="t">Resume endpoint</span></div>
        <div class="f05-step-2-slot empty" id="f05-step-2-slot-4" data-plan-step="4" style="top:336px"><span class="n">4</span><span class="t">Billing on complete</span></div>
        <div class="f05-step-2-slot empty" id="f05-step-2-slot-5" data-plan-step="5" style="top:448px"><span class="n">5</span><span class="t">Sweeper</span></div>
        <div class="f05-step-2-slot empty" id="f05-step-2-slot-6" data-plan-step="6" style="top:560px"><span class="n">6</span><span class="t">SDK resume</span></div>
      </div>

      <!-- DIAGRAM -->
      <div class="f05-step-2-node dim" id="f05-step-2-node-sdk"      data-plan-component="sdk"      style="left:700px;  top:380px; width:240px; height:100px"><span class="l">Client SDK</span><span class="s">packages/sdk</span></div>
      <div class="f05-step-2-node dim" id="f05-step-2-node-api"      data-plan-component="api"      style="left:1000px; top:380px; width:240px; height:100px"><span class="l">Upload API</span><span class="s">src/upload</span></div>
      <div class="f05-step-2-node navy dim" id="f05-step-2-node-manifest" data-plan-component="manifest" style="left:1300px; top:200px; width:260px; height:150px"><span class="l">Manifest store</span><span class="s">upload_manifests</span><div class="f05-step-2-row" id="f05-step-2-row">7f3a · 2 GB · <span class="f05-step-2-bits" id="f05-step-2-bits"><span class="f05-step-2-ones" id="f05-step-2-ones"></span><span class="f05-step-2-zeros" id="f05-step-2-zeros">000000</span></span></div></div>
      <div class="f05-step-2-node dim" id="f05-step-2-node-blob"     data-plan-component="blob"     style="left:1300px; top:540px; width:260px; height:100px"><span class="l">Blob store</span><span class="s">src/blob</span><div class="f05-step-2-ring" id="f05-step-2-ring"></div></div>
      <div class="f05-step-2-node dim" id="f05-step-2-node-billing"  data-plan-component="billing"  style="left:1620px; top:200px; width:220px; height:100px"><span class="l">Billing hook</span><span class="s">src/billing</span></div>
      <div class="f05-step-2-node dim" id="f05-step-2-node-sweeper"  data-plan-component="sweeper"  style="left:1620px; top:540px; width:220px; height:100px"><span class="l">Sweeper</span><span class="s">src/jobs</span></div>

      <!-- EDGES: frame-4 edge stays dim; this frame's api → blob edge draws on and takes the coral -->
      <svg class="f05-step-2-edges" id="f05-step-2-edges" viewBox="0 0 1920 1080">
        <path id="f05-step-2-e-api-manifest" class="dim" d="M1240 405 L1270 405 L1270 275 L1300 275" />
        <path id="f05-step-2-e-api-blob" class="active" d="M1240 455 L1270 455 L1270 590 L1300 590" />
      </svg>

      <!-- PART BOXES under Blob -->
      <div class="f05-step-2-parts" id="f05-step-2-parts">
        <div class="f05-step-2-box"><div class="f05-step-2-fill" id="f05-step-2-fill-1"></div></div>
        <div class="f05-step-2-box"><div class="f05-step-2-fill" id="f05-step-2-fill-2"></div></div>
        <div class="f05-step-2-box"><div class="f05-step-2-fill" id="f05-step-2-fill-3"></div></div>
        <div class="f05-step-2-box"><div class="f05-step-2-fill" id="f05-step-2-fill-4"></div></div>
        <div class="f05-step-2-box"><div class="f05-step-2-fill" id="f05-step-2-fill-5"></div></div>
        <div class="f05-step-2-box"><div class="f05-step-2-fill" id="f05-step-2-fill-6"></div></div>
      </div>

      <!-- RE-SEND: chip slides under box 1, tick points at it, 200 lands; bitmap stays put -->
      <div class="f05-step-2-tick" id="f05-step-2-tick"></div>
      <div class="f05-step-2-chip" id="f05-step-2-chip"><span>PUT /parts/1</span><span class="f05-step-2-badge" id="f05-step-2-badge">200</span></div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 10.496;
      var q = function (id) { return document.getElementById("f05-step-2-" + id); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["05-step-2"] = tl;

      /* ---- setup: the api → blob edge starts undrawn (svg-path-draw: measured length, never guessed) ---- */
      var edge = q("e-api-blob");
      var len = 195;
      try { len = edge.getTotalLength() || 195; } catch (e) {}
      len = len * 1.02;
      edge.style.strokeDasharray = String(len);
      edge.style.strokeDashoffset = String(len);

      /* ---- Scene 1 (0.0–1.2s): "Step two" → slot 2 fills; "parts" → coral lands on Blob ---- */
      tl.fromTo(q("slotfill"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power3.out" }, 0.15);
      tl.fromTo([q("slot-2-n"), q("slot-2-t")], { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.2);

      tl.fromTo(q("node-blob"), { opacity: 0.72 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 0.85);
      tl.fromTo(q("ring"), { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 0.85);

      /* ---- Scene 2 (1.2–6.4s): "Each PUT" → API wakes; "lands one chunk" → edge draws, takes the coral, box 1 fills;
              "flips one bit" → bitmap 000000 → 100000; boxes 2 + 3 land with their bits on the same cadence ---- */
      tl.fromTo(q("node-api"), { opacity: 0.72 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 1.5);

      // coral hand-off: the node ring gives the coral to the edge as it draws (never two corals at once)
      tl.to(q("ring"), { borderColor: "rgba(204,120,92,0)", duration: 0.35, ease: "power2.out" }, 1.9);
      tl.to(edge, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 1.9);

      tl.fromTo(q("parts"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.95);
      tl.fromTo(q("fill-1"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 2.45);

      tl.fromTo(q("node-manifest"), { opacity: 0.72 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, 3.35);

      tl.fromTo(q("fill-2"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 4.6);
      tl.fromTo(q("fill-3"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 5.5);

      // discrete-text-sequence: the bitmap is a sparse state list, reverse-searched each frame — instant jumps, no smear
      var SEQ = [
        { t: 0.0,  ones: "",    zeros: "000000" },
        { t: 3.6,  ones: "1",   zeros: "00000" },
        { t: 4.75, ones: "11",  zeros: "0000" },
        { t: 5.65, ones: "111", zeros: "000" }
      ];
      var onesEl = q("ones"), zerosEl = q("zeros");
      function stateAt(t) {
        for (var i = SEQ.length - 1; i >= 0; i--) { if (t >= SEQ[i].t) return SEQ[i]; }
        return SEQ[0];
      }
      var driver = { t: 0 };
      tl.to(driver, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: function () {
          var s = stateAt(driver.t);
          if (onesEl.textContent !== s.ones) onesEl.textContent = s.ones;
          if (zerosEl.textContent !== s.zeros) zerosEl.textContent = s.zeros;
        }
      }, 0);
      // a quiet settle on each flip (immediateRender off so the bits sit at 1 until their cue)
      [3.6, 4.75, 5.65].forEach(function (t) {
        tl.fromTo(q("bits"), { scale: 1.08 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, t);
      });

      /* ---- Scene 3 (6.4–10.0s): "Re-sending a done part" → PUT /parts/1 slides to box 1 and stops;
              "changes nothing" → 200 lands, the bitmap stays 111000; hold ---- */
      tl.fromTo(q("chip"), { opacity: 0, x: -260 }, { opacity: 1, x: 0, duration: 0.75, ease: "power3.out" }, 6.6);
      tl.fromTo(q("tick"), { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power2.out" }, 7.3);
      tl.fromTo(q("badge"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 7.9);

      // hold to the fixed duration
      tl.set({}, {}, DUR);
    })();
  </script>
</template>
