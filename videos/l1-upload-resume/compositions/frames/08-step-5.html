  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 8.853;
      var CORAL = "#CC785C", INK = "#141413", HAIR = "rgba(20,20,19,0.12)";
      var SHADOW = "0 1px 3px rgba(20,20,19,0.08), 0 4px 16px rgba(20,20,19,0.04)";
      var SHADOW_CORAL = "0 0 0 1px #CC785C, 0 1px 3px rgba(20,20,19,0.08), 0 4px 16px rgba(20,20,19,0.04)";
      var q = function (id) { return document.getElementById("f08-step-5-" + id); };

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["08-step-5"] = tl;

      /* ── Scene 1 (0.0–1.2s): "Step five" → slot 5 fills; "the sweeper" → coral lands on the Sweeper node ── */
      tl.fromTo(q("slot-5-fill"), { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0.10);
      tl.fromTo([q("slot-5-n"), q("slot-5-t")], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.05 }, 0.18);

      tl.to(q("node-sweeper"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.70);
      tl.fromTo(q("node-sweeper"), { borderColor: HAIR, boxShadow: SHADOW },
        { borderColor: CORAL, boxShadow: SHADOW_CORAL, duration: 0.35, ease: "power3.out" }, 0.70);

      /* ── Scene 2 (1.2–5.6s) ── */
      // "a day old": second manifest row types in (discrete-text-sequence: sparse states, pauses at breaks)
      tl.to(q("node-manifest"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.55);

      var TYPE_START = 1.65, TYPE_END = 3.35;
      var SEQ = [
        { t: 0.00, text: "" },
        { t: 1.70, text: "2" },
        { t: 1.82, text: "2c" },
        { t: 1.94, text: "2c9" },
        { t: 2.06, text: "2c91" },
        { t: 2.42, text: "2c91 " },
        { t: 2.50, text: "2c91 ·" },
        { t: 2.58, text: "2c91 · " },
        { t: 2.70, text: "2c91 · 2" },
        { t: 2.82, text: "2c91 · 26" },
        { t: 2.94, text: "2c91 · 26h" },
        { t: 3.20, text: "2c91 · 26h · " }
      ];
      var STATUS = [
        { t: 0.00, text: "" },
        { t: 3.32, text: "∅" },
        { t: 4.10, text: "abandoned" }   // "get aborted": the status swaps; coral moves to this word
      ];
      function stateAt(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) { if (time >= seq[i].t) return seq[i].text; }
        return "";
      }
      var txtEl = q("row-2-txt"), stEl = q("row-2-st"), curEl = q("row-2-cur");
      var driver = { t: 0 };
      tl.to(driver, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: function () {
          var t = driver.t;
          txtEl.textContent = stateAt(SEQ, t);
          stEl.textContent = stateAt(STATUS, t);
          stEl.style.color = t >= 4.10 ? CORAL : "#FAF9F5";
          // block cursor: sin square wave (~0.6s cycle) only while the row is being typed
          var on = t >= TYPE_START && t < TYPE_END && Math.sin((t - TYPE_START) * Math.PI * 2 / 0.6) >= 0;
          curEl.style.opacity = on ? "1" : "0";
        }
      }, 0);

      // "get aborted": coral leaves the Sweeper node and draws the Sweeper → Manifest edge
      tl.set(q("node-sweeper"), { borderColor: HAIR, boxShadow: SHADOW }, 3.55);
      tl.set(q("e-sweeper-manifest"), { stroke: CORAL, strokeWidth: 3 }, 3.55);
      tl.fromTo(q("e-sweeper-manifest"), { strokeDashoffset: 435 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 3.55);
      // the row flips to "abandoned" at 4.10 (driver above); the edge settles to ink at the same instant
      tl.set(q("e-sweeper-manifest"), { stroke: INK, strokeWidth: 2 }, 4.10);

      // "their parts deleted": Sweeper → Blob edge draws; three part boxes fade + hairline strike
      tl.to(q("node-blob"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.55);
      tl.fromTo(q("e-sweeper-blob"), { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 4.60);
      tl.to([q("part-4"), q("part-5"), q("part-6")], { opacity: 0.72, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 4.95);
      tl.fromTo(q("strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 5.05);

      /* ── Scene 3 (5.6–9.0s): "storage leak closed" → bounded tag; hold ── */
      tl.fromTo(q("tag"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.45);
    })();
  </script>
