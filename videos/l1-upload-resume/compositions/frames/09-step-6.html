    (function () {
      window.__timelines = window.__timelines || {};
      var q = function (id) { return document.getElementById("f09-step-6-" + id); };
      var INK = "#141413", CORAL = "#CC785C";

      var slotFill = q("slot6-fill"), slotN = q("slot6-n"), slotT = q("slot6-t");
      var nodeSdk = q("node-sdk"), nodeApi = q("node-api"), nodeBlob = q("node-blob");
      var ringSdk = q("ring-sdk"), chip = q("chip");

      var ezA = q("ez-a"), ezB = q("ez-b"), mzA = q("mz-a"), mzB = q("mz-b");
      var mover = q("mover");

      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      /* ---- Scene 1 (0.0–1.0s): "Step six" — slot 6 fills, coral lands on the SDK node ---- */
      tl.fromTo(slotFill, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.5 }, 0.15);
      tl.fromTo([slotN, slotT], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.06 }, 0.25);
      tl.fromTo(nodeSdk, { opacity: 0.72 }, { opacity: 1, duration: 0.4 }, 0.55);
      tl.fromTo(ringSdk, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.45 }, 0.55);

      /* ---- Scene 2 (1.0–4.4s): "keeps its upload id" → chip; "asks what's missing" → edge lights + bitmap ---- */
      tl.fromTo(chip, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.5 }, 1.5);

      tl.fromTo(edge, { opacity: 0.35, stroke: INK, strokeWidth: 2 },

      tl.fromTo(zbox, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.45 }, 3.45);
