  <script>
    (function () {
      var DURATION = 14.784;
      var tl = gsap.timeline({ paused: true });

      var stage   = "#f12-questions-stage";
      var kicker  = "#f12-questions-kicker";
      var spike   = "#f12-questions-kicker .f12-questions-spike";
      var lead    = "#f12-questions-lead";
      var note    = "#f12-questions-note";
      var cards   = ["#f12-questions-card-1", "#f12-questions-card-2", "#f12-questions-card-3"];
      var leaders = ["#f12-questions-leader-1", "#f12-questions-leader-2", "#f12-questions-leader-3"];
      var pins    = ["#f12-questions-pin-1", "#f12-questions-pin-2", "#f12-questions-pin-3"];

      // initial state (deterministic; no CSS transitions anywhere)
      gsap.set(stage, { opacity: 0.72 });
      gsap.set([kicker, lead, note], { opacity: 0 });
      gsap.set(cards, { opacity: 0, transformOrigin: "0% 50%" });
      gsap.set(leaders, { strokeDasharray: 80, strokeDashoffset: 80 });
      gsap.set(pins, { opacity: 0 });

      // Scene 1 (0.0–1.2s): the full stage lifts to full opacity; ✱ kicker on "Three calls for you"
      tl.fromTo(stage, { opacity: 0.72 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 0);
      tl.fromTo(kicker, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.25);
      tl.fromTo(spike, { scale: 0.92, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0.25);

      // Scene 2 (1.2–8.6s): three cards pop in on cue, each with a hairline leader drawn to its rail slot
      var cues = [1.5, 4.5, 7.4]; // "Step one" / "Step four" / "Step five"
      for (var i = 0; i < 3; i++) {
        var t = cues[i];
        tl.fromTo(pins[i], { opacity: 0 }, { opacity: 0.7, duration: 0.2, ease: "power2.out" }, t);
        tl.fromTo(leaders[i], { strokeDashoffset: 80 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, t);
        tl.fromTo(cards[i],
          { opacity: 0, x: -14, scale: 0.96 },
          { opacity: 1, x: 0, scale: 1, duration: 0.55, ease: "power3.out" }, t + 0.12);
      }

      // Scene 3 (8.6–10.0s): lead line beneath the diagram, then the mono note bottom-right
      tl.fromTo(lead, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 9.3);
      tl.fromTo(note, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 9.9);

      // Scene 4: dead-still hold to the end (final frame — no exit, no settle)
      tl.to({}, { duration: DURATION - 10.4 }, 10.4);

      window.__timelines = window.__timelines || {};
      window.__timelines["12-questions"] = tl;
