  .caption-stage {

    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a

    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE lifted cream card — warm cream fill, 1px hairline ink border, one soft warm

  .caption-pill {
    max-width: 78%;
    padding: 22px 44px 26px;
    background: var(--cap-canvas, var(--rp-paper));
    border: 1px solid color-mix(in srgb, var(--cap-ink, var(--rp-ink)) 12%, transparent);
    border-radius: 12px;

    font-weight: 500;
    font-size: clamp(40px, 4.4vw, 56px);
    line-height: 1.24;
    letter-spacing: -0.02em;
  }

  /* upcoming — faint warm ink, no underline */
  .caption-word {
    display: inline-block;
    padding: 0 0.02em 0.06em;
    color: color-mix(in srgb, var(--cap-ink, var(--rp-ink)) 40%, var(--cap-canvas, var(--rp-paper)));
    border-bottom: 3px solid transparent;

  /* current word — full ink under the coral voltage underline (the brand's signature

  .caption-word.is-active {

    border-bottom: 3px solid var(--cap-accent, var(--rp-coral));
  }
  /* already spoken — solid warm ink, underline cleared */

    color: var(--cap-ink, var(--rp-ink));
    border-bottom: 3px solid transparent;
  }

  .caption-word.cap-brand {

  .caption-word.cap-brand.is-active {
    border-bottom: 3px solid var(--cap-accent, var(--rp-coral));
