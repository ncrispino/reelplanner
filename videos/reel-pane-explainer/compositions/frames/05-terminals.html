<script>
(function () {
  window.__timelines = window.__timelines || {};
  var q = function (id) { return document.getElementById("f05-terminals-" + id); };
  var tl = gsap.timeline({ paused: true });

  // a tile draws: wipes open from the top, its terminal window rises inside
  function drawTile(n, at) {
    tl.fromTo(q("t" + n), { opacity: 0, y: 28, clipPath: "inset(0% 0% 100% 0% round 12px)" },
      { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0% round 12px)", duration: 0.55, ease: "power3.out" }, at);
    tl.fromTo(q("w" + n), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, at + 0.18);
  }

  // Scene 1 (0–3.5 s): "kitty" (0.32) and "Ghostty" (0.80) draw, each with its picture
  drawTile(1, 0.2);
  drawTile(2, 0.68);
  [1, 2].forEach(function (n, i) {
    var at = 0.55 + i * 0.48;
    tl.fromTo(q("p" + n), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, at);
    tl.fromTo(q("f" + n), { scaleX: 0 }, { scaleX: 0.08, duration: 0.3, ease: "none" }, at + 0.2);
    tl.fromTo(q("k" + n), { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, at + 0.25);
  });
  // "the picture plays" (1.38–1.64): the play glyph gives way and the progress runs
  [1, 2].forEach(function (n) {
    tl.to(q("play" + n), { opacity: 0, scale: 0.8, duration: 0.3, ease: "power2.in" }, 1.5);
    tl.fromTo(q("f" + n), { scaleX: 0.08 }, { scaleX: 0.72, duration: 7.4, ease: "none", immediateRender: false }, 1.6);
  });

  // Scene 2 (3.5–8.9 s): "Anywhere else" (3.52) the third tile draws
  drawTile(3, 3.45);
  // "browser player" (5.58): the link chip
  tl.fromTo(q("link"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 5.5);
  // closing line in place by ~6 s, held to the end (≥ 3 s)
  tl.fromTo(q("cmd"), { opacity: 0, y: 16, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 5.85);
  tl.fromTo([q("r1"), q("r2")], { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 5.9);
  // "keeps the choices" (6.76–7.26): the stop card and its options
  tl.fromTo(q("card"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 6.7);
  tl.fromTo([q("o1"), q("o2"), q("o3")], { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out", stagger: 0.16 }, 6.85);
  // "comments" (8.34) and "Send" (8.74)
  tl.fromTo(q("com"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 8.1);
  tl.fromTo(q("send"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 8.45);

  window.__timelines["05-terminals"] = tl;
})();
