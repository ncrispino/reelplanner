<script>
(function () {
  const E = "power3.out";
  const tl = gsap.timeline({ paused: true });

  // split a line's text nodes into one span per character, so it can be typed from the timeline
  function chars(el) {
    const out = [];
    Array.from(el.childNodes).forEach(function (n) {
      if (n.nodeType !== 3) return;
      const frag = document.createDocumentFragment();
      n.textContent.split("").forEach(function (c) {
        const s = document.createElement("span");
        s.textContent = c;
        s.style.display = "none";
        frag.appendChild(s);
        out.push(s);
      });
      n.parentNode.replaceChild(frag, n);
    });
    return out;
  }
  function type(el, start, end) {
    const cs = chars(el);
    const step = (end - start) / cs.length;
    cs.forEach(function (s, i) { tl.set(s, { display: "inline" }, start + i * step); });
  }

  // Scene 1 (0 – 3.8 s): the place label, the terminal draws on, the conversation types in
  tl.fromTo("#f01-hook-kicker", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, 0.05);
  tl.fromTo("#f01-hook-outline-rect", { attr: { "stroke-dashoffset": 1000 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut" }, 0.1);
  tl.fromTo("#f01-hook-win", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: E }, 0.7);
  tl.fromTo(".f01-hook-line.f01-hook-type", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.0);
  type(document.querySelector("#f01-hook-l1"), 1.0, 1.6);
  type(document.querySelector("#f01-hook-l2"), 1.8, 2.6);
  type(document.querySelector("#f01-hook-l3"), 2.75, 3.3);

  // Scene 2: the prompt waits ("With the plugin installed"), `/reel` types on "slash reel",
  // and the pane slides in from the right edge on "plays it in a pane"
  tl.fromTo("#f01-hook-prompt", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, 3.84);
  type(document.querySelector("#f01-hook-cmd-text"), 5.32, 5.62);
  tl.fromTo("#f01-hook-pane", { x: 720 }, { x: 0, duration: 0.7, ease: E }, 5.98);
  tl.fromTo("#f01-hook-video", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.4, ease: E }, 6.3);
  tl.fromTo("#f01-hook-cap", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 6.5);

  // Scene 3: the progress bar under the video fills, then everything holds (7.1 s to the end)
  tl.fromTo("#f01-hook-fill", { scaleX: 0 }, { scaleX: 0.3, duration: 0.6, ease: "none" }, 6.5);

  window.__timelines = window.__timelines || {};
  window.__timelines["01-hook"] = tl;
})();
</script>
