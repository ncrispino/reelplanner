<script>
(function () {
  var P = "f18-step-6-";
  var q = function (id) { return document.getElementById(P + id); };

  var tl = gsap.timeline({ paused: true });

  var slot6 = q("slot-6");
  var sdk = q("node-sdk"), api = q("node-api"), blob = q("node-blob");
  var ring = q("sdk-ring");
  var eSdk = q("e-sdk-api");
  var chipSdk = q("chip-sdk"), chipSdk2 = q("chip-sdk-2");
  var chipBlob = q("chip-blob"), chipBlob2 = q("chip-blob-2");
  var bitbox = q("bitbox"), bitZero = q("bit-zero"), bitOne = q("bit-one");

  // cues: 0.05 Step · 0.40 six · 1.25 SDK · 1.47 saves · 2.22 upload · 2.76 ID · 3.02 7F3A · 4.60 reconnect
  //       5.54 asks · 6.04 bits · 6.42 set · 6.86 sends · 7.11 only · 7.55 part · 7.64 four

  // "Step six": slot 6 fills, completing the rail; coral on the SDK node border
  tl.fromTo(slot6, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power3.out" }, 0.05)
    .fromTo(slot6.querySelectorAll(".n, .t"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.09)
    .to(sdk, { opacity: 1, duration: 0.35, ease: "power3.out" }, 0.40)
    .fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, 0.42);

  // "saves the upload ID": the saved-id chip under Client SDK
  tl.fromTo(chipSdk, { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 3.51);

  // "asks": coral hands from the SDK border to the existing sdk→api edge (lit, not drawn)
  tl.to(ring, { opacity: 0, duration: 0.25, ease: "power2.out" }, 5.54)
    .to(eSdk, { opacity: 1, stroke: __RP["coral"], strokeWidth: 4, duration: 0.3, ease: "power2.out" }, 5.854);

  // "set": the 0 inside the Manifest chip is boxed (1.5 px ink); nothing floats between the nodes
  tl.fromTo(bitbox, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, 6.796);

  // "sends": the edge settles to ink and the coral hands off to the chip under Client SDK; API and Blob wake

    .to(chipSdk, { color: __RP["coral-deep"], duration: 0.3, ease: "power2.out" }, 6.86)
    .to(api, { opacity: 1, duration: 0.3, ease: "power2.out" }, 6.95)
    .to(blob, { opacity: 1, duration: 0.3, ease: "power2.out" }, 7.624);

  // "part four": the SDK chip names the part; the boxed 0 in the Manifest chip flips to 1 (7f3a · 111011 → 7f3a · 111111), parts 5 → 6
  tl.to(chipSdk, { opacity: 0, duration: 0.25, ease: "power2.out" }, 7.55)
    .fromTo(chipSdk2, { y: 6, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 7.55)
    .to(bitOne, { opacity: 1, duration: 0.25, ease: "power2.out" }, 7.64)

    .to(bitbox, { opacity: 0, duration: 0.3, ease: "power2.out" }, 7.7)
