<!-- start: {"layout": "row"} -->
<!-- tail: 0.6 -->
<div class="dk-title" data-k="title" data-label>{{title}}</div>
<div class="dk-subtitle" data-k="sub" data-label>{{subtitle}}</div>
<div class="dk-tagline" data-k="tag" data-label>{{tagline}}</div>
<div class="dk-dot" data-k="d1" style="left:943px;top:660px;--c:{{color:ana}}"></div>
<div class="dk-dot" data-k="d2" style="left:873px;top:780px;--c:{{color:ben}}"></div>
<div class="dk-dot" data-k="d3" style="left:1013px;top:780px;--c:{{color:cleo}}"></div>
<svg class="dk-svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <path data-k="r1" d="M893 778 Q900 700 946 684" style="fill:none;stroke:{{color:ben}};stroke-width:5;stroke-linecap:round;opacity:0"/>
  <path data-k="r2" d="M1013 797 Q960 830 907 797" style="fill:none;stroke:{{color:cleo}};stroke-width:5;stroke-linecap:round;opacity:0"/>
  <path data-k="r3" d="M974 684 Q1020 700 1027 778" style="fill:none;stroke:{{color:ana}};stroke-width:5;stroke-linecap:round;opacity:0"/>
</svg>
<script>
  K.show('[data-k="title"]', 0.15); K.show('[data-k="sub"]', 0.55); K.show('[data-k="tag"]', 1.0);
  K.show('[data-k="d1"], [data-k="d2"], [data-k="d3"]', 0.5, { pop: true, stagger: 0.2 });
  K.draw('[data-k="r1"]', @@a puzzle@@, 0.5); K.draw('[data-k="r2"]', @@a puzzle+0.4@@, 0.5); K.draw('[data-k="r3"]', @@a puzzle+0.8@@, 0.5);
  K.pulse('[data-k="d1"], [data-k="d2"], [data-k="d3"]', @@open what@@, 1);
  K.hide('[data-k]', DUR - 0.45, 0.4);
</script>
