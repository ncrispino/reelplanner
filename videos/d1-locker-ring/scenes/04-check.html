<!-- start: {"layout": "ring", "areas": true, "names": true, "items": "held", "slots": true, "locks": true, "arrows": true, "head": "h4"} -->
<!-- tail: 1.6 -->
<div class="dk-head" data-head="h4" data-label>Two ways to finish</div>
<div class="dk-head" data-head="h5" data-label>The nightly check</div>
<div class="dk-at dk-clock" data-k="clock" style="left:160px;top:730px">
  <div class="bar"></div><div class="fill"></div>
  <div class="tick" style="left:0"></div><div class="tick" style="left:1597px"></div>
  <div class="lab" style="left:0" data-label>9 am</div><div class="lab" style="left:1597px" data-label>9 pm: the check</div>
</div>
<div class="dk-at dk-recap" data-k="recap" style="left:60px;top:130px;width:560px">
  <div data-k="l1" style="opacity:0" data-label><b>Each locker</b> opens to one neighbour’s key</div>
  <div data-k="l2" style="opacity:0" data-label><b style="color:var(--warn)">Or</b> the manager’s master key</div>
</div>
<script>
  K.unhead("h4", 0.05); K.head("h5", 0.3);
  K.zoom(0.1, 0.72, 520, 40, 1.0);
  K.show('[data-k="clock"]', @@Each night@@ - 0.3);
  K.carry("ben", "ana", @@Each night@@, 1.6);
  K.clock(@@Each night@@, @@every locker@@ - @@Each night@@ + 0.2, 12);
  K.state("ana", "passed", @@every locker+0.5@@); K.pulse('[data-slot="ana"]', @@every locker+0.7@@, 1);
  K.show('[data-k="recap"]', @@So each courier@@ - 0.2);
  K.show('[data-k="l1"]', @@So each courier@@); K.ring(@@finishes only@@, 0.5);
  K.show('[data-k="l2"]', @@or the master key@@); K.pulse('.dk-lock', @@or the master key+0.3@@, 1);
</script>
