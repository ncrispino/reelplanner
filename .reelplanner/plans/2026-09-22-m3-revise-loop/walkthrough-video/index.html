<!doctype html>
<html lang="en">
  <head>
<!-- The video's colour system, as tokens, so one attribute on <html> recolours the whole thing.

     Dark mode is not an inversion. Each token keeps its MEANING across themes, and where a naive
     flip would destroy the meaning, the value is chosen to preserve it instead:

     · --rp-data is the one tile that differs from every other tile — the diagram's landmark, "where
       state lives". In light it is the dark tile on cream. Inverting it would make it the same shade
       as the dark ground and the landmark would vanish, so in dark it becomes the one LIGHT tile.
       The eye still finds the store first, which is the whole reason the tile exists.
     · --rp-slab is a photograph or a code window. Those are dark because that is what they are, not
       because the page is light, so they do not move at all.
     · --rp-shadow-rgb stays black in both. A shadow flipped light is a glow, and the anti-slop
       checklist bans glows.
     · --rp-coral is the same coral in both themes. It is the one accent and the reviewer's pen
       colour; an accent that changes hue with the lights is not an identity.
     · --rp-coral-deep is the same role in both — small coral TEXT that must clear 4.5:1 on its own
       ground — which means a different value: it darkens on cream and lightens on charcoal.

     The legacy --cap-* / --ink / --navy names that the captions layer emits are redefined here in
     terms of these tokens, so captions follow the theme without that generated file being edited. -->
<style id="rp-theme">
  :root {
    --rp-paper:#FAF9F5; --rp-tile:#EFE9DE; --rp-tile-2:#ECE3D4;
    --rp-ink:#141413; --rp-on-ink:#FAF9F5; --rp-data:#181715;
    --rp-coral:#CC785C; --rp-coral-deep:#A5614A;
    --rp-slab:#181715; --rp-slab-bar:#252320; --rp-slab-ink:#FAF9F5;
    --rp-ink-rgb:20,20,19; --rp-on-ink-rgb:250,249,245; --rp-tile-rgb:239,233,222;
    --rp-coral-rgb:204,120,92; --rp-slab-ink-rgb:250,249,245; --rp-shadow-rgb:20,20,19;
  }
  :root[data-theme="dark"] {
    --rp-paper:#141310; --rp-tile:#232120; --rp-tile-2:#2C2925;
    --rp-ink:#F2EFE8; --rp-on-ink:#141413; --rp-data:#EFE9DE;
    --rp-coral:#CC785C; --rp-coral-deep:#E3A184;
    --rp-slab:#181715; --rp-slab-bar:#252320; --rp-slab-ink:#FAF9F5;
    --rp-ink-rgb:242,239,232; --rp-on-ink-rgb:20,20,19; --rp-tile-rgb:35,33,32;
    --rp-coral-rgb:204,120,92; --rp-slab-ink-rgb:250,249,245; --rp-shadow-rgb:0,0,0;
  }
  /* The generated captions layer speaks in these names, and its own stylesheet is parsed later in
     the document, so a plain :root here would lose the cascade to it. :root:root outranks it on
     specificity instead, which is what !important would buy without the shouting. */
  :root:root {
    --ink:var(--rp-ink); --cream:var(--rp-paper); --tile:var(--rp-tile); --tile-strong:var(--rp-tile-2);
    --coral:var(--rp-coral); --navy:var(--rp-data); --navy-soft:var(--rp-slab); --navy-elev:var(--rp-slab-bar);
    --cap-ink:var(--rp-ink); --cap-canvas:var(--rp-paper); --cap-accent:var(--rp-coral); --cap-accent-2:var(--rp-tile-2);
  }
  html, body { background:var(--rp-paper); }
</style>
<script>
  // Frame timelines are built once, at load, and GSAP cannot interpolate through a var(). So the
  // tween colours read the live token values here instead; switching theme rebuilds the composition.
  window.__RP = new Proxy({}, { get: (_, k) =>
    getComputedStyle(document.documentElement).getPropertyValue("--rp-" + String(k)).trim() });
</script>
