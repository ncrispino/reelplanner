    height: var(--cap-band-height, 180px);

    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a

    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;

    border: 1px solid color-mix(in srgb, var(--cap-ink, var(--rp-ink)) 12%, transparent);
    border-radius: 12px;
    box-shadow:

  }
  .caption-line {
    display: flex;

    font-weight: 500;
    font-size: clamp(40px, 4.4vw, 56px);
    line-height: 1.24;
    letter-spacing: -0.02em;
  }

  /* upcoming — faint warm ink, no underline */
  .caption-word {
    display: inline-block;
    padding: 0 0.02em 0.06em;
    color: color-mix(in srgb, var(--cap-ink, var(--rp-ink)) 40%, var(--cap-canvas, var(--rp-paper)));
    border-bottom: 3px solid transparent;

  /* current word — full ink under the coral voltage underline (the brand's signature

  }

  .caption-word.is-spoken {
    color: var(--cap-ink, var(--rp-ink));
    border-bottom: 3px solid transparent;
  }

  .caption-word.cap-brand {
    font-style: italic;

  }
  .caption-word.cap-brand.is-active {
    border-bottom: 3px solid var(--cap-accent, var(--rp-coral));
  }

  .caption-word.cap-num {

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        __rpShowWord(span, w);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.98 }, { scale: 1, duration: 0.16, ease: "power1.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));

<style data-rp-caption-code>
  /* names.md: a tool's name in the captions, in the frames' code voice (JetBrains Mono), on a solid chip
     the caption's own text colour fills: the chip is the words' colour and its letters the caption's
     ground, so it reads at full contrast on either skin and in either theme, at the words' own size and
     weight. The fill follows the word's karaoke state (still to come a little softer, said full); no
     coral (coral is only "yours, waiting on you", D-142). The old chip (--rp-tile-2 at 0.8em, the word's
     colour on it) was white on cream on the dark pill: too pale to read. */
  @font-face { font-family: 'JetBrains Mono'; src: url('assets/fonts/JetBrainsMono-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'JetBrains Mono'; src: url('assets/fonts/JetBrainsMono-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }
  .caption-word .cap-code {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: inherit;
    font-size: 1em;
    letter-spacing: 0;
    font-variant-ligatures: none;
    color: inherit;
    /* the default layer: white words on a dark pill, so a light chip with dark letters. The word's colour
       is laid over an opaque light grey, so the chip is solid in either karaoke state (the words still to
       come are white at 55%) and the chips of one command meet without a seam where they overlap */
    background: linear-gradient(currentColor, currentColor) #b8b7b3;
    -webkit-text-fill-color: #181715;
    padding: 0.02em 0.22em 0.06em;
    border-radius: 0.18em;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  /* the preset skin's card: ink words on the canvas (cream in light, dark in dark), so an ink chip with
     canvas letters, pulled towards full ink so a word still to come is not a pale grey */
  .caption-pill .caption-word .cap-code {
    background: color-mix(in srgb, currentColor, var(--cap-ink, var(--rp-ink)) 60%);
    -webkit-text-fill-color: var(--cap-canvas, var(--rp-paper));
  }
  /* a command of several words reads as one chip: each chip but the last reaches over the gap between
     the caption's words (0.3em of the line and the words' own padding, 0.34em, or a space) and a little more, so no
     hairline shows at the join, and the inner corners are square */
  .caption-word .cap-code[data-run="start"], .caption-word .cap-code[data-run="mid"] { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: -0.38em; }
  .caption-word .cap-code[data-run="end"], .caption-word .cap-code[data-run="mid"] { border-top-left-radius: 0; border-bottom-left-radius: 0; }
</style>
