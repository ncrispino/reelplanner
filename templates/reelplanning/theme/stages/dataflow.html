     "f" + your frame_id. Positions/sizes are LAW. Per frame you change only: which slots are filled,
     opacity/dim, which edges exist, which ONE element is coral, and the small supporting elements. -->
<style>

  .FID-node { position:absolute; border-radius:12px; background:#EFE9DE; border:1px solid rgba(20,20,19,0.12); box-shadow:0 1px 3px rgba(20,20,19,0.08),0 4px 16px rgba(20,20,19,0.04); display:flex; align-items:center; justify-content:center; }

  .FID-node.active { border:3px solid #B8552E; }
  .FID-edges { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible; pointer-events:none; }

</style>
