<!-- LANES: who does what, in order (scenes/README.md). Each actor is a lane across the scene, and a "now" line steps
     from event to event, each pinned on its lane as the narration names it. Use it wherever a step is a hand-off
     between parts or people (a request through a service, a change from pull request to the live site, an order from
     form to inbox): the order, and who holds it at each moment, are what the viewer needs, and a list of steps hides
     both. It is the `sequence` stage stages/README.md asks for.

     Start a frame from it with `reelplanner scene <video-dir> <frame>=lanes` (or paste it into a frame's <template> and
     replace every FID with "f" + the frame id). Fill each slot with the plan's own actors and events (`frame-lint`
     fails a slot left as it is):
       {{place}}       a quiet place label: the step this is
       {{actor-1}} … {{actor-3}}   the actors, top to bottom, in plain words
       {{event-1}} … {{event-7}}   what happens, a few plain words each, in order
       {{event-1-detail}} …        the thing it names, as written (a file, a value); an event with none deletes its span
     Event 2 is the one that goes wrong (the cross), event 4 the one that passes (the tick); each event's lane is its
     top, its place in time its left and its EV entry. Two to four lanes and at most seven events; times only where
     the plan gives them.

     HOW IT MOVES (motion-language.md): the lanes are DRAWN; the now line steps to each event on the word that names
     it, and the event's mark and label are pinned there, so time only ever moves left to right. The one thing that
     goes wrong is the one coral mark. Replace the times with your cues; each event's x is the now line's stop. -->
<style>
  .FID-place { position:absolute; left:128px; top:96px; font:500 26px/1 "JetBrains Mono"; letter-spacing:0.06em; color:rgba(var(--rp-ink-rgb),0.62); white-space:nowrap; }
  .FID-who { position:absolute; left:128px; width:240px; font:500 38px/1 "Inter"; color:var(--rp-ink); }
  .FID-lane { position:absolute; left:400px; width:1400px; height:1px; background:rgba(var(--rp-ink-rgb),0.22); transform-origin:0 50%; }
  .FID-now { position:absolute; left:400px; top:190px; width:2px; height:640px; background:rgba(var(--rp-ink-rgb),0.34); }
  .FID-at { position:absolute; width:0; height:0; }                       /* an event: its mark at (left, top), its label above */
  .FID-dot { position:absolute; left:-12px; top:-12px; width:24px; height:24px; border-radius:50%; background:var(--rp-ink); }
  .FID-glyph { position:absolute; left:-24px; top:-26px; width:48px; height:48px; font:600 46px/48px "Inter"; text-align:center; color:var(--rp-ink); }
  .FID-glyph.bad { color:var(--rp-coral); font-size:56px; }
  .FID-ev { position:absolute; left:-14px; bottom:30px; width:250px; font:400 30px/1.25 "Inter"; color:var(--rp-ink); }
  .FID-ev .m { display:block; white-space:nowrap; font:500 26px/1.3 "JetBrains Mono"; color:rgba(var(--rp-ink-rgb),0.7); }
</style>

<div class="FID-place" id="FID-place">{{place}}</div>
<div class="FID-who" id="FID-p1" style="top:300px">{{actor-1}}</div>
<div class="FID-who" id="FID-p2" style="top:520px">{{actor-2}}</div>
<div class="FID-who" id="FID-p3" style="top:740px">{{actor-3}}</div>
<i class="FID-lane" id="FID-l1" style="top:320px"></i>
<i class="FID-lane" id="FID-l2" style="top:540px"></i>
<i class="FID-lane" id="FID-l3" style="top:760px"></i>
<i class="FID-now" id="FID-now"></i>

<div class="FID-at" id="FID-a1" style="left:470px; top:320px"><i class="FID-dot" id="FID-m1"></i><div class="FID-ev" id="FID-e1" style="width:340px">{{event-1}} <span class="m">{{event-1-detail}}</span></div></div>
<div class="FID-at" id="FID-a2" style="left:740px; top:540px"><span class="FID-glyph bad" id="FID-m2">×</span><div class="FID-ev" id="FID-e2" style="width:340px">{{event-2}} <span class="m">{{event-2-detail}}</span></div></div>
<div class="FID-at" id="FID-a3" style="left:1010px; top:320px"><i class="FID-dot" id="FID-m3"></i><div class="FID-ev" id="FID-e3">{{event-3}} <span class="m">{{event-3-detail}}</span></div></div>
<div class="FID-at" id="FID-a4" style="left:1250px; top:540px"><span class="FID-glyph" id="FID-m4">✓</span><div class="FID-ev" id="FID-e4">{{event-4}} <span class="m">{{event-4-detail}}</span></div></div>
<div class="FID-at" id="FID-a5" style="left:1470px; top:760px"><i class="FID-dot" id="FID-m5"></i><div class="FID-ev" id="FID-e5">{{event-5}} <span class="m">{{event-5-detail}}</span></div></div>
<div class="FID-at" id="FID-a6" style="left:1630px; top:320px"><i class="FID-dot" id="FID-m6"></i><div class="FID-ev" id="FID-e6" style="width:160px">{{event-6}} <span class="m">{{event-6-detail}}</span></div></div>
<div class="FID-at" id="FID-a7" style="left:1760px; top:760px"><i class="FID-dot" id="FID-m7"></i><div class="FID-ev" id="FID-e7" style="width:120px">{{event-7}} <span class="m">{{event-7-detail}}</span></div></div>

<script>
  // after `var tl = gsap.timeline({ paused: true });`
  var EV = [[1, 470, 2.0], [2, 740, 3.4], [3, 1010, 4.9], [4, 1250, 6.0], [5, 1470, 7.1], [6, 1630, 8.2], [7, 1760, 8.9]];   // [event, x, cue]
  gsap.set(["#FID-place", "#FID-p1", "#FID-p2", "#FID-p3", "#FID-now"], { opacity: 0 });
  gsap.set(["#FID-l1", "#FID-l2", "#FID-l3"], { scaleX: 0 });
  EV.forEach(function (e) { gsap.set("#FID-m" + e[0], { opacity: 0, scale: 0.4 }); gsap.set("#FID-e" + e[0], { opacity: 0, y: 8 }); });
  tl.to("#FID-place", { opacity: 1, duration: 0.4 }, 0.2);
  tl.to(["#FID-l1", "#FID-l2", "#FID-l3"], { scaleX: 1, duration: 0.8, ease: "power1.inOut", stagger: 0.12 }, 0.4);   // drawn
  tl.to(["#FID-p1", "#FID-p2", "#FID-p3"], { opacity: 1, duration: 0.35, stagger: 0.12 }, 0.6);
  tl.to("#FID-now", { opacity: 1, duration: 0.3 }, 1.4);
  EV.forEach(function (e) {
    tl.to("#FID-now", { x: e[1] - 400, duration: 0.5, ease: "power1.inOut" }, e[2] - 0.5);           // now steps to the event
    tl.to("#FID-m" + e[0], { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, e[2]);
    tl.to("#FID-e" + e[0], { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, e[2] + 0.08);   // pinned
  });
  tl.to("#FID-now", { opacity: 0, duration: 0.4 }, 9.5);                                               // the run is over
</script>
